name: Multi-Project ESP-IDF Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from the "Actions" tab

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project_path: [
          'emulator-console', 
          'interface_board',
          'left_screen',
          'right_screen',
          'factory apps/ITF factory app',
          'factory apps/left display factory app',
          'factory apps/right display factory app'
        ]
        target: ['esp32s3']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Cache Build Folder
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.project_path }}/build
            ~/.ccache
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.project_path }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-${{ matrix.project_path }}-

      - name: Build ESP-IDF Project
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: ${{ matrix.target }}
          path: ${{ matrix.project_path }}

      - name: Rename App Binary
        run: |
          # 1. Sanitize folder name for the filename
          SAFE_NAME=$(echo "$(basename "${{ matrix.project_path }}")" | tr ' ' '_')
          
          # 2. ESP-IDF identifies the app bin in project_description.json
          # But simpler: it's the only bin NOT named bootloader or partition-table
          cd "${{ matrix.project_path }}/build"
          APP_BIN=$(ls *.bin | grep -vE "bootloader|partition-table|ota_data_initial" | head -n 1)
          
          # 3. Move it to the root with the new name
          cp "$APP_BIN" "../../${SAFE_NAME}_${{ matrix.target }}.bin"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ strategy.job-index }}
          path: ./*.bin

  release:
    # Only run release logic if a tag was actually pushed
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-bins
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-bins/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}