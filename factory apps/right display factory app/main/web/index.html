<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Right display board factory app</title>
</head>

<body>
    <h1>Right display board setup</h1>
    <div id="info">Loading...</div>
    <!-- <div>Odometer: <span id="odometer">-</span> m &nbsp; Trip: <span id="trip">-</span> m</div>
    <div>
        New Odometer (m): <input id="new_odo" type="number"> <button type="button"onclick="fetch('/set_trip_odo?new_odo='+document.getElementById('new_odo').value,{method:'POST'}).then(()=>fetch('/odometer').then(r => r.json()).then(j => { document.getElementById('odometer').innerText = j.odometer_m; document.getElementById('trip').innerText = j.trip_m }))">Set odometer</button><br>
        New Trip (m): <input id="new_trip" type="number"> <button type="button" onclick="fetch('/set_trip_odo?new_trip='+document.getElementById('new_trip').value,{method:'POST'}).then(()=>fetch('/odometer').then(r => r.json()).then(j => { document.getElementById('odometer').innerText = j.odometer_m; document.getElementById('trip').innerText = j.trip_m }))">Set trip</button><br>
    </div> -->
    <h2>Partitions</h2>

    <div>
        Factory: <span id="factory_project">-</span> (<span id="factory_version">-</span>)<br>
        OTA0: <span id="ota0_project">-</span> (<span id="ota0_version">-</span>)<br>
        OTA1: <span id="ota1_project">-</span> (<span id="ota1_version">-</span>)<br>
    </div>
    <div>
        <button onclick="refreshPartitions()">Refresh Partitions info</button>
        <button onclick="fetch('/reboot',{method:'POST'}).then(()=>alert('Rebooting...'))">Reboot</button>
    </div>
    <h2>Upload Firmware</h2>
    <div>Previously running partition: <span id="prevRunningPart">-</span></div>
    <div>Recommended OTA partition: <span id="recOTAPart">-</span><br><br></div>

    <div>
        Target partition: <select name="target" id="target">
            <option value="ota_0">ota_0</option>
            <option value="ota_1">ota_1</option>
        </select><br><br>
        File: <input type="file" name="file" id="file" accept=".bin"><br><br>
        <button type="button" onclick="doUpload()">Upload and flash</button>
        <pre id="result"></pre>
    </div>

    <h2>Set Boot Partition</h2>
    <div>Currently selected: <span id="bootPart">-</span></div>
    <select id="bootsel">
        <option value="factory">factory</option>
        <option value="ota_0">ota_0</option>
        <option value="ota_1">ota_1</option>
    </select>
    <button
        onclick="fetch('/set_boot?target='+document.getElementById('bootsel').value,{method:'POST'}).then(r=>r.text()).then(t=>alert(t))">Set
        Boot and Reboot</button>


    <script>
        function refreshPartitions() {
            fetch('/partitions').then(r => r.json()).then(j => {
                if (j.factory) { document.getElementById('factory_project').innerText = j.factory.project_name || '-'; document.getElementById('factory_version').innerText = (j.factory.version + ' built ' + j.factory.date) || '-'; }
                if (j.ota_0) { document.getElementById('ota0_project').innerText = j.ota_0.project_name || '-'; document.getElementById('ota0_version').innerText = (j.ota_0.version + ' built ' + j.ota_0.date + ' STATE : ' + j.ota_0.state) || '-'; }
                if (j.ota_1) { document.getElementById('ota1_project').innerText = j.ota_1.project_name || '-'; document.getElementById('ota1_version').innerText = (j.ota_1.version + ' built ' + j.ota_1.date + ' STATE : ' + j.ota_1.state) || '-'; }
            });
            fetch('/prevboot').then(r => r.json()).then(j => {
                document.getElementById('bootPart').innerText = j.bootPart;
                document.getElementById('prevRunningPart').innerText = j.prevRunningPart;
                document.getElementById('recOTAPart').innerText = j.recOTAPart;
                document.getElementById('bootsel').value = j.bootPart;
                document.getElementById('target').value = j.recOTAPart
            });
        }

        function doUpload() {
            var f = document.getElementById('file').files[0];
            if (!f) {
                alert('Choose file');
                return;
            }
            var target = document.getElementById('target').value;
            const baseURL = '/upload?target=' + target + '&';
            uploadFile(f, baseURL, 'result').then(() => refreshPartitions());
        }

        async function uploadFile(file, baseURL, resultID) {
            const uploadURL = baseURL; // Your ESP32 endpoint
            const fileSize = file.size;
            const logOutput = document.getElementById(resultID);
            // Reset UI elements
            logOutput.textContent = 'Starting file upload...';
            // 1. Construct the URL with file size
            const finalURL = `${uploadURL}size=${fileSize}`;
            logOutput.textContent += `\nTarget URL: ${finalURL}`;
            logOutput.textContent += `\nFile Size: ${fileSize} bytes.`;
            try {
                // 3. Make the fetch request with the custom stream
                const response = await fetch(finalURL, {
                    method: 'POST',
                    body: file,
                    headers: {
                        'Content-Type': 'application/octet-stream',
                    },
                });
                if (response.ok) {
                    const resultText = await response.text();
                    let formattedText;
                    try {
                        const j = JSON.parse(resultText);
                        formattedText = `\nStatus: ${j.status}\nProject: ${j.project_name}\nVersion: ${j.version}\nBuilt : ${j.date_time}`;
                    } catch (e) {
                        formattedText = resultText;
                    }
                    logOutput.textContent += `\n\n✅ Upload Success! Server Response: ${formattedText}`;
                } else {
                    const errorText = await response.text();
                    logOutput.textContent += `\n\n❌ Upload Failed! HTTP Status: ${response.status}. Error: ${errorText}`;
                }
            } catch (error) {
                logOutput.textContent += `\n\n❌ Network Error: Could not connect to the ESP32. ${error.message}`;
            }
        }

        window.addEventListener('load', function () {
            refreshPartitions();
            // fetch('/prevboot').then(r => r.json()).then(j => { document.getElementById('bootPart').innerText = j.bootPart; document.getElementById('prevRunningPart').innerText = j.prevRunningPart; document.getElementById('recOTAPart').innerText = j.recOTAPart });
            // fetch('/odometer').then(r => r.json()).then(j => { 
            //     document.getElementById('odometer').innerText = j.odometer_m;
            //     document.getElementById('new_odo').value = parseInt(j.odometer_m);
            //     document.getElementById('trip').innerText = j.trip_m;
            //     document.getElementById('new_trip').value = parseInt(j.trip_m); 
            // });
            fetch('/version').then(r => r.json()).then(j => {
                document.getElementById('info').innerText = ('Project: ' + j.project_name + ' Version: ' + j.version + ' Built : ' + j.date)
            });
        });
    </script>
</body>

</html>
